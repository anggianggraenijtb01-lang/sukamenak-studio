name: CI

on:
  # Every branch push runs CI, so a working branch gets a signal before anyone opens a PR (a rule that only
  # reproduces from a clean checkout, such as an over-eager .gitignore, showed up late for exactly that reason).
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A branch push and its pull request share one group: the newer run cancels the older one, so a PR branch is
# tested once per commit instead of twice. The head repository is part of the key: this repository is public, and a
# fork PR from a branch named "main" must not land in the same group as a push to main and cancel its run.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Throwaway CI-only values. Nothing here is a real secret; production secrets never live in the repository.
env:
  NODE_ENV: development
  DATABASE_URL: postgres://sukamenak:sukamenak@localhost:5432/sukamenak
  DATABASE_URL_TEST: postgres://sukamenak:sukamenak@localhost:5432/sukamenak_test
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
  JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210fedcba9876543210
  # 32 bytes, base64 (test-only key)
  CORE_PROMPT_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  QUEUE_DRIVER: inline
  STORAGE_DRIVER: local
  BCRYPT_COST: '4'

jobs:
  backend:
    name: backend (typecheck, migrate, test + coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sukamenak
          POSTGRES_PASSWORD: sukamenak
          POSTGRES_DB: sukamenak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sukamenak -d sukamenak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - run: npm ci

      # MinIO cannot be a `services:` container (it needs a start command), so it runs as a plain container.
      # test/integration/storageS3.spec.ts talks to localhost:9000, bucket "sukamenak", minioadmin/minioadmin.
      # Same image as docker-compose.yml (minio/minio is no longer pullable).
      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio --user 0:0 -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live > /dev/null || { docker logs minio; exit 1; }
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket sukamenak

      # test/security/prompt-leak.spec.ts scans frontend/dist/assets/*.js; without a build that test fails on purpose.
      - name: Build the frontend (the bundle leak scan needs it)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate (development database)
        run: npm run migrate

      # Global setup creates and migrates sukamenak_test, truncates it and seeds it before the first spec.
      # test:ci also fails the run when ANY test was skipped or is a todo (scripts/assertNoSkips.mjs); a missing
      # Redis, MinIO or frontend build already fails the spec itself because CI never sets TEST_ALLOW_SKIP.
      - name: Test with coverage (unit + integration + security; threshold 70% lines; no skipped tests)
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage
            backend/test-results.json
          if-no-files-found: ignore

  frontend:
    name: frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Builds the frontend and scans dist/assets/*.js for core prompt text and the old AES key, and scans
  # frontend/src for the same markers. Blocking: PRD section 9 requires it green before anything merges to main
  # (the frontend no longer ships a mock core prompt or key since phase D).
  prompt-leak-bundle:
    name: prompt-leak-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sukamenak
          POSTGRES_PASSWORD: sukamenak
          POSTGRES_DB: sukamenak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sukamenak -d sukamenak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Prompt-leak spec against frontend/dist
        working-directory: backend
        run: |
          test -d ../frontend/dist/assets
          npx vitest run test/security/prompt-leak.spec.ts

      - name: Frontend source scan
        working-directory: backend
        run: npx vitest run test/security/frontend-source-leak.spec.ts

  # Phase H: the creator and admin journeys in a real browser, against the real API and a database that
  # globalSetup rebuilds. Postgres is the only service: the suite runs the API with QUEUE_DRIVER=inline and
  # STORAGE_DRIVER=local, and the seed installs mock providers, so no API key and no MinIO are involved.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sukamenak
          POSTGRES_PASSWORD: sukamenak
          POSTGRES_DB: sukamenak
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sukamenak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://sukamenak:sukamenak@localhost:5433/sukamenak_e2e
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcd
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789ab
      # Test-only core-prompt key (32 bytes of 0x07, base64). The seed encrypts the stand-ins with it and
      # the API decrypts them with the same value.
      CORE_PROMPT_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      FILE_SIGNING_SECRET: ci-file-signing-secret-0123456789abcdef01
      CORS_ORIGIN: http://127.0.0.1:5173
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend and the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload the report when a flow failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/report
            frontend/test-results
          retention-days: 7

  # Types and a single still frame of the Remotion composition. A full render is deliberately absent:
  # it takes ~40 s plus a 300 MB browser download on every push, and the backend video specs already
  # exercise the queue, storage and Range serving against a stand-in renderer.
  video:
    name: video (typecheck, still render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Chrome Headless Shell is ~300 MB; key the cache on the Remotion version so an upgrade re-downloads.
      - name: Cache Chrome Headless Shell
        uses: actions/cache@v4
        with:
          path: video/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}

      - name: Render one still frame
        run: |
          mkdir -p out
          npx remotion still src/index.ts StoryPromo out/ci-frame.png --frame=0

      - name: The still is a 1080x1920 PNG
        run: |
          node -e "
            const fs = require('node:fs');
            const b = fs.readFileSync('out/ci-frame.png');
            if (b.readUInt32BE(16) !== 1080 || b.readUInt32BE(20) !== 1920) {
              throw new Error('unexpected canvas ' + b.readUInt32BE(16) + 'x' + b.readUInt32BE(20));
            }
            console.log('still ok', b.length, 'bytes');
          "
