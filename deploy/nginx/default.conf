# Web container: serves the SPA and proxies /api to the API container. TLS and security headers are added by
# Caddy in front of it (deploy/Caddyfile), so the API sees two proxy hops (TRUST_PROXY=2).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Reference uploads are at most 8 MB (backend/src/middleware/upload.ts); leave room for the multipart envelope.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Vite puts a content hash in every asset name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # index.html must never be cached, or a deploy keeps serving the old asset names.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
